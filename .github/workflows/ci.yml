name: CI Pipeline
#Acciones que ejecutan el archivo
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

#jobs: trabajos a ejecutar
jobs:
  front-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    
    - name: Instalar dependencias
      run: npm install
    
    - name: Ejecutar tests del frontend
      # La variable CI=true es vital para que React no se quede esperando en la consola
      run: npm run test
      env:
        CI: true
  front-build:
    needs: front-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository (git clone)
      # hace un git clone al frontend
        uses: actions/checkout@v4

      - name: Setup node (instalar node)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: install dependency
        run: npm install
      
      - name: run build
        run: npm run build
  back-test: # El backend test es independiente de back-build y front-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      mysql: #Crea un container con las características del mysql para levantar los test dependientes"
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: spa_proyect22
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout repository (git clone)
        uses: actions/checkout@v4
      - name: Config JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Ejecutar test del backend
        run: mvn clean test -Dspring.profiles.active=test
  back-build:
    needs: back-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository (git clone)
        uses: actions/checkout@v4
      - name: Config JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Empaquetar Aplicación
        run: mvn clean package -DskipTests
      

            